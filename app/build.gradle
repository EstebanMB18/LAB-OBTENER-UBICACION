plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.labubicaciongps'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.labubicaciongps"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
}

// Kotlin 1.8 ya incluye las clases JDK7/JDK8 dentro de kotlin-stdlib.
// Se excluyen los artefactos antiguos transitivos para evitar Duplicate class.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Dependencia solicitada explícitamente en la guía del laboratorio.
    implementation 'com.google.android.gms:play-services-location:17.1.0'
}
